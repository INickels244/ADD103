<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet and Maui - Photo Album</title>

    <!-- Bootstrap 5.3 CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="py-4 text-center bg-dark text-white mb-4">
        <div class="container">
            <h1 class="fw-bold">Comet and Maui</h1>
            <p class="lead mb-0">Weird things my cats do. Comet is alot weirder then Maui.</p>
        </div>
    </header>

    <main class="container my-4">
        <section class="mb-5" aria-labelledby="comet-heading">
            <h2 id="comet-heading" class="mb-3">Comet</h2>
            <div class="row g-4">
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/CometSink.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Comet trying to get water from the sink">
                        <figcaption class="p-3">He will soon realize he is wet.</figcaption>
                    </div>
                </figure>
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/CometGhost.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Comet hiding behind a curtain">
                        <figcaption class="p-3">He thinks he's hiding, he is not.</figcaption>
                    </div>
                </figure>
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/CometKitchen.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Comet perched on the kitchen cabinets">
                        <figcaption class="p-3">He won't stop climbing the cabinets.</figcaption>
                    </div>
                </figure>
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/CometCouch.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Comet sitting on a couch cushion">
                        <figcaption class="p-3">I have no idea what he's doing.</figcaption>
                    </div>
                </figure>
            </div>
        </section>

        <section aria-labelledby="maui-heading">
            <h2 id="maui-heading" class="mb-3">Maui</h2>
            <div class="row g-4">
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/MauiChair.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Maui lounging on a chair">
                        <figcaption class="p-3">He's having the time of his life.</figcaption>
                    </div>
                </figure>
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/MauiBox.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Maui sitting in a box">
                        <figcaption class="p-3">Cat in a box.</figcaption>
                    </div>
                </figure>
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/MauiToy.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Maui biting a mouse toy">
                        <figcaption class="p-3">So aggressive.</figcaption>
                    </div>
                </figure>
                <figure class="col-12 col-sm-6 col-lg-3 mb-0">
                    <div class="bg-white border rounded shadow-sm overflow-hidden">
                        <img src="Images/MauiWindow.jpg" class="w-100 object-fit-cover" style="height: 280px;"
                            alt="Maui looking out the window">
                        <figcaption class="p-3">He's so photogenic.</figcaption>
                    </div>
                </figure>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 my-4 border-top">
        <p class="mb-0"><a href="../index.html" class="text-decoration-none">Back to Student Portal</a></p>
    </footer>

</body>

</html>
