<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ivy Nickels Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="main-header">
        <div class="brand">
            <div class="logo-box">IN</div>
            <h1 class="site-title">Ivy Nickels</h1>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">HOME</a>
            <a href="gallery.html" class="nav-link">GALLERY</a>
            <a href="contact.html" class="nav-link active">CONTACT</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="split-container">

            <div class="text-content">
                <h2>Get in Touch</h2>
                <p>Feel free to reach out for design inquiries, photography bookings, or portfolio feedback.</p>
                <p><strong>Email:</strong> eemmaaiill</p>
            </div>

            <div class="form-box">
                <form action="#" method="post" class="contact-form">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Jane Doe">

                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="jane@example.com">

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required
                        placeholder="Write your message here..."></textarea>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>

        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ivy Nickels. All rights reserved.</p>
    </footer>

</body>

</html>
