<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Wall</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Responsive Photo Wall</h1>
        <p>A bunch of sunset photos, that were found on Pixabay.</p>
    </header>

    <main class="photo-wall">
        <div class="photo-card">
            <img src="Photos/giani-mountains-100367.jpg" alt="Mountain valley lake">
            <h3>Sunset with Birds</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/11514282-sunset-6911736_1920.jpg" alt="Misty forest path">
            <h3>Ocean Sunset</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/12019-sunset-2080072_1920.jpg" alt="Pug wrapped in a blanket">
            <h3>Red Sunset with Trees</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/chiemseherin-sunset-8516639_1920.jpg" alt="Waterfall into canyon">
            <h3>Pastel Sunset on the Water</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/uniquedesign52-sunset-656967_1920.jpg" alt="Sunset landscape">
            <h3>Sunset Covered by Clouds</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/kordi_vahle-sunset-3726030_1920.jpg" alt="View looking up at skyscrapers">
            <h3>Beach Sunset</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/levanevsky-sunset-4086848_1920.jpg" alt="Jellyfish swimming in dark water">
            <h3>Pastel Sunset</h3>
        </div>
        <div class="photo-card">
            <img src="Photos/deltaworks-clouds-449822.jpg" alt="Dramatic clouds in the sky">
            <h3>Cloudy Sunset</h3>
        </div>
    </main>

    <footer>
        <p><a href="../../index.html">Back to Student Portal</a></p>
    </footer>

</body>
