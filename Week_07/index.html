<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Profile</h1>
    </header>

    <main class="card">
        <div class="avatar-container">
            <img class="avatar" src="profilepic.jpg" alt="Jane Doe avatar">
        </div>

        <div class="info">
            <h2>Jane Doe</h2>
            <h3>Web Developer</h3>
            <p>Passionate about building responsive, accessible, and user-friendly web experiences.</p>
        </div>
    </main>

    <footer>
        <p><a href="../index.html">Back to Student Portal</a></p>
    </footer>

</body>

</html>
