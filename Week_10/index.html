<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Safari Gallery | Responsive Images</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f4f4f4;
        }

        main,
        footer {
            max-width: 900px;
            margin: 0 auto 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        section {
            margin-bottom: 2rem;
        }

        section:last-of-type {
            margin-bottom: 0;
        }

        img,
        picture img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <main>
        <h1>Wildlife Safari Gallery</h1>

        <section>
            <img src="images/cheetah-7277665_1280.jpg" srcset="images/cheetah-480.jpg 480w,
                        images/cheetah-800.jpg 800w,
                        images/cheetah-7277665_1280.jpg 1280w" sizes="(max-width: 1028px) calc(100vw - 128px), 900px"
                alt="Cheetah walking through the dry grass of the African savanna.">
        </section>

        <section>
            <picture>
                <source media="(max-width: 600px)" srcset="images/leopard-mobile-480.jpg 480w,
                            images/leopard-mobile-800.jpg 800w" sizes="(max-width: 600px) calc(100vw - 128px), 480px">
                <img src="images/animal-19621_1280.jpg" srcset="images/leopard-480.jpg 480w,
                            images/leopard-800.jpg 800w" sizes="(max-width: 1028px) calc(100vw - 128px), 900px"
                    alt="Close-up portrait of a leopard's face and eyes.">
            </picture>
        </section>

        <section>
            <img src="images/lions-21787_1280.webp" alt="Two lionesses resting near a tree.">
        </section>
    </main>

    <footer>
        <a href="../index.html">Back to Student Portal</a>
    </footer>

</body>

</html>
