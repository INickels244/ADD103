<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6B: Interactive Gallery Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header / Nav -->
    <header class="page-header">
        <h1>Nature Gallery</h1>
        <p>I don't know what this is going to be. I didn't look that far ahead.</p>
    </header>

    <!-- Main Content Container -->
    <main class="wrapper">

        <!-- CODE PREPARATION -->
        <div class="gallery-container">

            <!-- Hero / Main Enlarged Image Display -->
            <div class="main-display">
                <img id="current" src="images/placeholder.jpg" alt="A photo here maybe?">
            </div>

            <!-- 5 Thumbnail Options -->
            <div class="thumb">
                <img src="images/thumb1.jpg" alt="Thumbnail 1: Mountain landscape with clear blue water">
            </div>
            <div class="thumb">
                <img src="images/thumb2.jpg" alt="Thumbnail 2: Mountain landscape with grass and tree fields">
            </div>
            <div class="thumb">
                <img src="images/thumb3.jpg" alt="Thumbnail 3: Purple/ pink sky reflecting on water">
            </div>
            <div class="thumb">
                <img src="images/thumb4.jpg" alt="Thumbnail 4: Sunset behind mountains with magenta flowers ">
            </div>
            <div class="thumb">
                <img src="images/thumb5.jpg" alt="Thumbnail 5: The milkyway behind mountains ">
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Web Development Student | ADD 103</p>
        <p><a href="../index.html">Back to Course Portal</a></p>
    </footer>

</body>

</html>
