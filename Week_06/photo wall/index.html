<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6A: CSS Grid Cat Photo Wall</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-text">
            <h1>Feline Photo Wall</h1>
            <p>This is a wall of cats. All pictures taken from Unsplash.</p>
        </div>
        <div class="hero-image">
            <img src="images/raoul-droog-yMSecCHsIBc-unsplash.jpg" alt="A cat wearing sunglasses">
        </div>
    </header>

    <!-- Photo Wall Section -->
    <main class="container">
        <h2>---------- Cat Gallery ----------</h2>
        <div class="photo-wall">
            <img src="images/ayako-h7Dw2hF4e0A-unsplash.jpg" alt="A tabby cat from far away">
            <img src="images/borna-bevanda-VwqecUsYKvs-unsplash.jpg" alt="A fluffy tabby cat leaning on a wall">
            <img src="images/darren-richardson-KCdivsKLuWQ-unsplash.jpg" alt="A tuxedo cat looking at the camera">
            <img src="images/ludemeula-fernandes-9UUoGaaHtNE-unsplash.jpg" alt="An orange tabby sleeping">
            <img src="images/luiza-sayfullina-9giow4jXrzM-unsplash.jpg" alt="A white cat looking at the camera">
            <img src="images/maria-baranova-gYjRiJ831ok-unsplash.jpg" alt="A black cat hunting">
            <img src="images/mikhail-vasilyev-IFxjDdqK_0U-unsplash.jpg" alt="A ragdoll cat being cute">
            <img src="images/paul-hanaoka-o6RbK3y7mK4-unsplash.jpg" alt="A tuxedo cat will big eyes">
            <img src="images/zoe-gayah-jonker-G7kUPmzi80E-unsplash.jpg" alt="An orange cat looking at the camera">

        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Web Development | ADD 103</p>
        <p><a href="../../index.html">Back to Course Portal</a></p>
    </footer>

</body>

</html>
