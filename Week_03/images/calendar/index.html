<!DOCTYPE html>
<html lang="en">

<head>
    <title>December 2026 Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <table>
        <caption>December 2026</caption>

        <thead>
            <tr>
                <th scope="col">Sunday</th>
                <th scope="col">Monday</th>
                <th scope="col">Tuesday</th>
                <th scope="col">Wednesday</th>
                <th scope="col">Thursday</th>
                <th scope="col">Friday</th>
                <th scope="col">Saturday</th>
            </tr>
        </thead>

        <tbody>

            <!-- Week 1 -->
            <tr>
                <td colspan="2"></td>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>

            <!-- Week 2 -->
            <tr>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td>10</td>
                <td>11</td>
                <td>12</td>
            </tr>

            <!-- Week 3 -->
            <tr>
                <td>13</td>
                <td>14</td>
                <td>15</td>
                <td>16</td>
                <td>17</td>
                <td>18</td>

                <!-- Birthday on December 19 -->
                <td class="birthday">
                    19 <img src="../star.png" alt="My Birthday Star">
                </td>
            </tr>

            <!-- Week 4 -->
            <tr>
                <td>20</td>
                <td>21</td>
                <td>22</td>
                <td>23</td>
                <td>24</td>
                <td>25</td>
                <td>26</td>
            </tr>

            <!-- Week 5 -->
            <tr>
                <td>27</td>
                <td>28</td>
                <td>29</td>
                <td>30</td>
                <td>31</td>
                <td colspan="2"></td>
            </tr>

        </tbody>
    </table>
